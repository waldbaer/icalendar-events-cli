schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Automation platforms such as Node-RED run this tool and parse its JSON and jCal output. Treat option names,
  output structures and exit codes as a public interface: breaking them requires a major version and a
  "Breaking Changes" entry in CHANGELOG.md.
  Designs and tasks must cover Linux, macOS and Windows, and Python 3.10 to 3.15.
  Every user-visible change gets a CHANGELOG.md entry under the unreleased version, linking the PR.
  CLI changes must update README.md, including the "All Available Parameters" help output.
  Test coverage must stay at 100%.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
